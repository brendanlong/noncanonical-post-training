[project]
name = "noncanon"
version = "0.1.0"
description = "Non-canonical token output across post-training stages"
requires-python = ">=3.12"
dependencies = [
    "datasets>=3.0",
    "huggingface-hub>=0.30",
    "transformers>=4.57,<5",
    "pyarrow>=15",
    "numpy>=1.26",
    "jinja2>=3.1.6",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
gpu = [
    "peft>=0.21.0",
    "vllm==0.11.*",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=8",
]
